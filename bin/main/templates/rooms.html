<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ルーム作成・参加 | 簡易自由律じゃんけん</title><!-- Bootstrapを先に読み込み、サイト独自の調整を後から適用する。 --><link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/style.css}"><script defer th:src="@{/js/original-hand.js}"></script><script defer th:src="@{/js/status-polling.js}"></script></head>
<body>
<header th:fragment="header" class="navbar app-header border-bottom"><div class="container app-header-inner"><strong class="navbar-brand mb-0">簡易自由律じゃんけん</strong><div class="d-flex align-items-center gap-3 flex-wrap"><span class="badge text-bg-light user-name" th:text="${username}"></span><form class="m-0" method="post" th:action="@{/logout}"><button class="btn btn-outline-secondary btn-sm" type="submit">ログアウト</button></form></div></div></header>
<main class="container app-main shadow-sm" data-page="rooms"><h1 class="h2 fw-bold page-title">ルーム作成・参加</h1><p class="text-body-secondary">友達と同じルーム名を入力して、対戦を始めましょう。</p>
<div th:if="${!originalHandFormOpen}"><section th:replace="~{login :: errors}"></section></div>
<section th:replace="~{fragments/original-hand :: editor}"></section>
<form class="app-form" method="post" th:action="@{/rooms/enter}" th:object="${roomEnterForm}">
<label class="form-label" for="roomName">ルーム名（前後の空白を除いて1～20文字）</label>
<input class="form-control" id="roomName" type="text" th:field="*{roomName}" aria-describedby="roomName-errors">
<ul class="list-unstyled app-list" id="roomName-errors" th:if="${fieldErrors != null}"><li th:each="message : ${fieldErrors['roomName']}" th:text="${message}"></li></ul>
<button class="btn btn-primary" type="submit">ルームへ入る</button>
</form>
</main></body></html>
