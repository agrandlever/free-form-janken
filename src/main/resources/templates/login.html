<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>簡易自由律じゃんけん</title><link rel="icon" type="image/png" th:href="@{/favicon.png}"><!-- Bootstrapを先に読み込み、サイト独自の調整を後から適用する。 --><link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/style.css}"><script defer th:src="@{/js/form-feedback.js}"></script></head>
<body class="login-page"><main class="container app-main shadow-sm login-card">
<!-- タイトルはロゴの代替テキストで読み上げ、装飾のアイコンは読み上げを省く。 -->
<h1 class="login-title">
<img class="login-icon" th:src="@{/images/icon.png}" alt="" width="1312" height="1199">
<img class="login-logo" th:src="@{/images/logo.png}" alt="簡易自由律じゃんけん" width="381" height="37">
</h1>
<p class="text-primary fw-semibold mb-2">自分だけの手で、いざ勝負。</p>
<p class="text-body-secondary mb-4">名前を決めて、みんなでじゃんけんを楽しもう。</p>
<section th:fragment="errors" th:if="${errorCode != null}" role="alert" class="errors alert alert-danger" tabindex="-1" aria-labelledby="error-title">
<h2 class="h5 fw-bold mt-0" id="error-title" th:text="${errorTitle}"></h2>
<ul class="list-unstyled app-list" th:if="${!#lists.isEmpty(errorSummaryMessages)}"><li th:each="message : ${errorSummaryMessages}" th:attr="id=${affinityGroupError != null and message == affinityGroupError ? 'affinity-group-error' : null}" th:text="${message}"></li></ul>
<ul class="error-field-links" th:if="${!#lists.isEmpty(errorFieldLinks)}"><li th:each="field : ${errorFieldLinks}"><a th:href="|#${field.inputId}|" th:text="|${field.label}を確認する|"></a></li></ul>
</section>
<form class="app-form" method="post" th:action="@{/login}" th:object="${loginForm}">
<label class="form-label" for="username">遊ぶときの名前</label>
<input class="form-control" id="username" type="text" th:field="*{username}" th:attr="aria-invalid=${uiFieldErrors != null and uiFieldErrors.containsKey('username') ? 'true' : null}" autocomplete="nickname" aria-describedby="username-hint username-errors">
<p class="form-text" id="username-hint">1～20文字（前後の空白は除きます）</p>
<ul class="list-unstyled app-list" id="username-errors" th:if="${uiFieldErrors != null}"><li th:each="message : ${uiFieldErrors['username']}" th:text="${message}"></li></ul>
<button class="btn btn-primary btn-lg w-100" type="submit">この名前ではじめる</button>
</form>
</main></body></html>
