<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="editor" class="original-hand card card-body bg-body-tertiary">
<h2 class="h5 fw-bold">オリジナル手</h2>
<p th:if="${!hasOriginalHand}">オリジナル手が作成されていません</p>
<p th:if="${hasOriginalHand}">オリジナル手：<span th:text="${originalHandName}"></span></p>
<button class="btn btn-outline-primary" th:if="${canEditOriginalHand}" id="open-original-hand" type="button" aria-controls="original-hand-panel" th:attr="aria-expanded=${originalHandFormOpen}"
        th:text="${hasOriginalHand ? (originalHandForm.returnPage == 'MATCH_RESULT' ? '自分のオリジナル手を編集' : 'オリジナル手を編集') : 'オリジナル手を作成'}"></button>
<div th:if="${canEditOriginalHand}" id="original-hand-panel" th:hidden="${!originalHandFormOpen}">
<section th:replace="~{login :: errors}"></section>
<form class="app-form" method="post" th:action="@{/original-hand/save}" th:object="${originalHandForm}">
<input id="original-save-returnPage" type="hidden" th:field="*{returnPage}">
<input th:if="${originalHandForm.roomId != null}" id="original-save-roomId" type="hidden" th:field="*{roomId}">
<input th:if="${originalHandForm.resultMatchId != null}" id="original-save-resultMatchId" type="hidden" th:field="*{resultMatchId}">
<label class="form-label" for="original-hand-name">名前（前後の空白を除いて1～20文字）</label>
<input class="form-control" id="original-hand-name" type="text" th:field="*{name}" aria-describedby="original-hand-name-errors">
<ul class="list-unstyled app-list" id="original-hand-name-errors" th:if="${fieldErrors != null}"><li th:each="message : ${fieldErrors['name']}" th:text="${message}"></li></ul>
<!-- 同じ相性の選択肢は共通の項目名でまとめ、1つだけ選べるようにする。 -->
<fieldset class="mb-3">
<legend class="fs-6">グーへの相性</legend>
<div class="d-flex flex-wrap gap-2">
<div class="form-check form-check-inline">
<input class="form-check-input" id="vsRock-WIN" type="radio" th:field="*{vsRock}" value="WIN" aria-describedby="vsRock-errors">
<label class="form-check-label" for="vsRock-WIN">勝ち</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" id="vsRock-LOSE" type="radio" th:field="*{vsRock}" value="LOSE" aria-describedby="vsRock-errors">
<label class="form-check-label" for="vsRock-LOSE">負け</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" id="vsRock-DRAW" type="radio" th:field="*{vsRock}" value="DRAW" aria-describedby="vsRock-errors">
<label class="form-check-label" for="vsRock-DRAW">引き分け</label>
</div>
</div>
<p class="text-danger mb-1" th:if="${originalHandRejectedValues != null and originalHandRejectedValues.containsKey('vsRock')}" th:text="|無効な選択値：${originalHandRejectedValues['vsRock']}|"></p>
<ul class="list-unstyled app-list" id="vsRock-errors" th:if="${fieldErrors != null}"><li th:each="message : ${fieldErrors['vsRock']}" th:text="${message}"></li></ul>
</fieldset>
<fieldset class="mb-3">
<legend class="fs-6">チョキへの相性</legend>
<div class="d-flex flex-wrap gap-2">
<div class="form-check form-check-inline">
<input class="form-check-input" id="vsScissors-WIN" type="radio" th:field="*{vsScissors}" value="WIN" aria-describedby="vsScissors-errors">
<label class="form-check-label" for="vsScissors-WIN">勝ち</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" id="vsScissors-LOSE" type="radio" th:field="*{vsScissors}" value="LOSE" aria-describedby="vsScissors-errors">
<label class="form-check-label" for="vsScissors-LOSE">負け</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" id="vsScissors-DRAW" type="radio" th:field="*{vsScissors}" value="DRAW" aria-describedby="vsScissors-errors">
<label class="form-check-label" for="vsScissors-DRAW">引き分け</label>
</div>
</div>
<p class="text-danger mb-1" th:if="${originalHandRejectedValues != null and originalHandRejectedValues.containsKey('vsScissors')}" th:text="|無効な選択値：${originalHandRejectedValues['vsScissors']}|"></p>
<ul class="list-unstyled app-list" id="vsScissors-errors" th:if="${fieldErrors != null}"><li th:each="message : ${fieldErrors['vsScissors']}" th:text="${message}"></li></ul>
</fieldset>
<fieldset class="mb-3">
<legend class="fs-6">パーへの相性</legend>
<div class="d-flex flex-wrap gap-2">
<div class="form-check form-check-inline">
<input class="form-check-input" id="vsPaper-WIN" type="radio" th:field="*{vsPaper}" value="WIN" aria-describedby="vsPaper-errors">
<label class="form-check-label" for="vsPaper-WIN">勝ち</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" id="vsPaper-LOSE" type="radio" th:field="*{vsPaper}" value="LOSE" aria-describedby="vsPaper-errors">
<label class="form-check-label" for="vsPaper-LOSE">負け</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" id="vsPaper-DRAW" type="radio" th:field="*{vsPaper}" value="DRAW" aria-describedby="vsPaper-errors">
<label class="form-check-label" for="vsPaper-DRAW">引き分け</label>
</div>
</div>
<p class="text-danger mb-1" th:if="${originalHandRejectedValues != null and originalHandRejectedValues.containsKey('vsPaper')}" th:text="|無効な選択値：${originalHandRejectedValues['vsPaper']}|"></p>
<ul class="list-unstyled app-list" id="vsPaper-errors" th:if="${fieldErrors != null}"><li th:each="message : ${fieldErrors['vsPaper']}" th:text="${message}"></li></ul>
</fieldset>
<fieldset class="mb-3">
<legend class="fs-6">他のオリジナル手への相性</legend>
<div class="d-flex flex-wrap gap-2">
<div class="form-check form-check-inline">
<input class="form-check-input" id="vsOriginal-WIN" type="radio" th:field="*{vsOriginal}" value="WIN" aria-describedby="vsOriginal-errors">
<label class="form-check-label" for="vsOriginal-WIN">勝ち</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" id="vsOriginal-LOSE" type="radio" th:field="*{vsOriginal}" value="LOSE" aria-describedby="vsOriginal-errors">
<label class="form-check-label" for="vsOriginal-LOSE">負け</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" id="vsOriginal-DRAW" type="radio" th:field="*{vsOriginal}" value="DRAW" aria-describedby="vsOriginal-errors">
<label class="form-check-label" for="vsOriginal-DRAW">引き分け</label>
</div>
</div>
<p class="text-danger mb-1" th:if="${originalHandRejectedValues != null and originalHandRejectedValues.containsKey('vsOriginal')}" th:text="|無効な選択値：${originalHandRejectedValues['vsOriginal']}|"></p>
<ul class="list-unstyled app-list" id="vsOriginal-errors" th:if="${fieldErrors != null}"><li th:each="message : ${fieldErrors['vsOriginal']}" th:text="${message}"></li></ul>
</fieldset>
<p>相性4項目のうち最低1項目は負けにしてください。</p>
<button class="btn btn-primary" type="submit">決定</button>
<button class="btn btn-outline-secondary" id="close-original-hand" type="button">閉じる</button>
</form>
<form class="app-form" th:if="${hasOriginalHand}" method="post" th:action="@{/original-hand/delete}" th:object="${originalHandDeleteForm}">
<input id="original-delete-returnPage" type="hidden" th:field="*{returnPage}">
<input th:if="${originalHandDeleteForm.roomId != null}" id="original-delete-roomId" type="hidden" th:field="*{roomId}">
<input th:if="${originalHandDeleteForm.resultMatchId != null}" id="original-delete-resultMatchId" type="hidden" th:field="*{resultMatchId}">
<button class="btn btn-outline-danger" type="submit">オリジナル手を削除</button>
</form>
</div>
</section>
</body></html>
