<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ルーム | 簡易自由律じゃんけん</title><link rel="icon" type="image/png" th:href="@{/favicon.png}"><!-- Bootstrapを先に読み込み、サイト独自の調整を後から適用する。 --><link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/style.css}"><script defer th:src="@{/js/room.js}"></script><script defer th:src="@{/js/original-hand.js}"></script><script defer th:src="@{/js/status-polling.js}"></script><script defer th:src="@{/js/form-feedback.js}"></script></head>
<body><header th:replace="~{rooms :: header}"></header>
<main class="container app-main shadow-sm" data-page="room" th:attr="data-room-id=${roomId},data-self-user-id=${selfUserId},data-user-state=${userState}">
<div class="room-heading"><h1 class="h2 fw-bold page-title">ルーム：<span id="display-room-name" th:text="${roomName}"></span></h1>
<button class="btn btn-outline-secondary" id="copy-room-name" type="button">ルーム名をコピー</button></div>
<p id="copy-message" role="status" aria-live="polite"></p>
<div th:if="${!originalHandFormOpen}"><section th:replace="~{login :: errors}"></section></div>
<section class="room-members-section" aria-labelledby="members-title">
<h2 class="h5 fw-bold" id="members-title">参加者一覧</h2>
<p class="room-status" id="room-status" role="status" th:text="|参加者 ${members.size()}人・準備完了 ${readyMembers.size()}人|">参加者・準備状況</p>
<ul class="list-unstyled app-list" id="room-members"><li th:each="member : ${members}"><span th:text="${member.username}"></span><strong th:if="${member.host}">（ホスト）</strong><strong th:if="${member.ready}">（準備完了）</strong><strong th:if="${member.playing}">（現在対戦中）</strong><strong th:if="${!member.ready and !member.playing}">（準備前）</strong></li></ul>
</section>
<section class="room-primary-actions" aria-labelledby="ready-title">
<h2 class="h5 fw-bold" id="ready-title">対戦の準備</h2>
<p id="self-ready-status" role="status" th:text="${userState.name() == 'READY' ? 'あなたは準備完了です。設定を変えるときは「準備取消」を押してください。' : (hasOriginalHand ? '手を確認したら、準備完了を押しましょう。' : '対戦前に、自分の手を1つ作りましょう。')}"></p>
<p id="ready-saved-hand" th:hidden="${!hasOriginalHand}">保存した手：<strong th:text="${originalHandName}"></strong> ・ <a href="#original-hand-settings">保存済みの相性を確認</a></p>
<p class="small text-body-secondary">準備完了が2人以上で、対戦中でなければホストが開始できます。</p>
<div class="room-action-buttons">
<button class="btn btn-primary" id="create-original-hand" type="button" aria-controls="original-hand-panel" th:attr="aria-expanded=${originalHandFormOpen}" th:hidden="${hasOriginalHand or userState.name() != 'ROOM_WAITING'}">オリジナル手を作る</button>
<form class="app-form" id="ready-action" th:if="${userState.name() == 'ROOM_WAITING'}" th:hidden="${!hasOriginalHand}" method="post" th:action="@{/room/ready}" th:object="${roomActionForm}">
<input type="hidden" th:field="*{roomId}"><button class="btn btn-primary" type="submit">準備完了</button>
</form>
<form class="app-form" id="ready-action" th:if="${userState.name() == 'READY'}" method="post" th:action="@{/room/ready/cancel}" th:object="${roomActionForm}">
<input type="hidden" th:field="*{roomId}"><button class="btn btn-outline-secondary" type="submit">準備取消</button>
</form>
<div id="start-action"><form class="app-form" th:if="${isHost}" method="post" th:action="@{/room/start}">
<input type="hidden" name="roomId" th:value="${roomId}"><button class="btn btn-primary" type="submit" th:disabled="${matchRunning or readyMembers.size() < 2}">対戦開始</button>
</form></div>
</div>
<p id="ready-waiting-message" role="status" th:text="${matchRunning ? '現在の対戦が終わるのを待っています。' : (members.size() &lt; 2 ? '参加者が2人必要です。ルーム名を共有して相手を招待してください。' : (readyMembers.size() &lt; 2 ? (userState.name() == 'READY' ? '相手の準備完了を待っています。' : '準備完了が2人必要です。手を保存して準備完了を押してください。') : (isHost ? '対戦を開始できます。' : 'ホストの対戦開始を待っています。')))}"></p>
<div id="match-running" th:hidden="${!matchRunning}"><p>現在対戦中です</p><a class="btn btn-outline-primary" id="watch-match" th:href="${matchRunning} ? @{/play(matchId=${currentMatchId})} : null">対戦を見る</a></div>
</section>
<section class="content-section"><h2 class="h5 fw-bold">対戦ルール</h2>
<div class="rule-summary"><p><span id="display-target-wins" th:text="${targetWins}"></span>勝先取</p>
<p>オリジナル手の連続使用：<span id="display-prevent-consecutive" th:text="${preventConsecutiveSameOriginalHand ? '不可' : '可能'}"></span></p></div>
<!-- 標準のdetailsで、入力値を残したままキーボードでも開閉できる。入力エラー時は開いて再表示する。 -->
<details id="rule-editor" th:hidden="${!isHost or matchRunning}" th:attr="open=${fieldErrors != null and (fieldErrors.containsKey('targetWins') or fieldErrors.containsKey('preventConsecutiveSameOriginalHand')) ? 'open' : null}">
<summary>ルールを変更</summary>
<form class="app-form" th:if="${isHost and !matchRunning}" method="post" th:action="@{/room/rules}" th:object="${roomRuleForm}">
<p class="fw-semibold">ルールの変更（ホストのみ・対戦中は変更不可）</p>
<input type="hidden" th:field="*{roomId}">
<label class="form-label" for="targetWins">先取勝数</label>
<input class="form-control" type="text" inputmode="numeric" th:field="*{targetWins}" th:attr="aria-invalid=${uiFieldErrors != null and uiFieldErrors.containsKey('targetWins') ? 'true' : null}" aria-describedby="targetWins-errors">
<ul class="list-unstyled app-list" id="targetWins-errors" th:if="${uiFieldErrors != null}"><li th:each="message : ${uiFieldErrors['targetWins']}" th:text="${message}"></li></ul>
<label class="form-label"><input class="form-check-input me-2" type="checkbox" th:field="*{preventConsecutiveSameOriginalHand}" th:attr="aria-invalid=${uiFieldErrors != null and uiFieldErrors.containsKey('preventConsecutiveSameOriginalHand') ? 'true' : null}" aria-describedby="prevent-consecutive-errors">同じオリジナル手の連続使用を不可にする</label>
<ul class="list-unstyled app-list" id="prevent-consecutive-errors" th:if="${uiFieldErrors != null}"><li th:each="message : ${uiFieldErrors['preventConsecutiveSameOriginalHand']}" th:text="${message}"></li></ul>
<button class="btn btn-primary" type="submit">ルール変更</button>
</form></details>
<p>通常のグー・チョキ・パーは連続して選択できます。</p>
</section>
<section th:replace="~{fragments/original-hand :: editor}"></section>
<div class="room-leave">
<form class="app-form" method="post" th:action="@{/room/leave}" th:object="${roomActionForm}">
<input type="hidden" th:field="*{roomId}">
<ul class="list-unstyled app-list" th:if="${uiFieldErrors != null}"><li th:each="message : ${uiFieldErrors['roomId']}" th:text="${message}"></li></ul>
<button class="btn btn-outline-danger" type="submit">ルームを退出</button>
</form>
</div>
</main></body></html>
