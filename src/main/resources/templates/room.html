<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ルーム | 簡易自由律じゃんけん</title><link rel="stylesheet" th:href="@{/css/style.css}"><script defer th:src="@{/js/room.js}"></script><script defer th:src="@{/js/original-hand.js}"></script></head>
<body><header th:replace="~{rooms :: header}"></header>
<main><h1>ルーム：<span id="display-room-name" th:text="${roomName}"></span></h1>
<div th:if="${!originalHandFormOpen}"><section th:replace="~{login :: errors}"></section></div>
<section th:replace="~{fragments/original-hand :: editor}"></section>
<button id="copy-room-name" type="button">ルーム名をコピー</button>
<p id="copy-message" role="status" aria-live="polite"></p>
<form method="post" th:action="@{/room/leave}" th:object="${roomActionForm}">
<input type="hidden" th:field="*{roomId}">
<ul th:if="${fieldErrors != null}"><li th:each="message : ${fieldErrors['roomId']}" th:text="${message}"></li></ul>
<button type="submit">ルームを退出</button>
</form>
<h2>参加者一覧</h2><ul><li th:each="member : ${members}"><span th:text="${member.username}"></span><strong th:if="${member.host}">（ホスト）</strong></li></ul>
</main></body></html>
